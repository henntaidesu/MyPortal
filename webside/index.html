<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>门户</title>
    <!-- 指南针图标，public/ 下的真实文件；打包成 exe 时 exe 图标、托盘图标、
         运行窗口图标用的都是同一份，见 portal.spec -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      // 首屏前应用主题，避免闪白
      try {
        // 主题单独存一份，不在按用户分开存的那份数据里；home-nav-theme 是改名前的老键
        const theme = localStorage.getItem('portal-nav-theme') ||
          localStorage.getItem('home-nav-theme') || 'auto'
        const dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
